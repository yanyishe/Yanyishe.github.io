<meta charset="UTF-8">

<title>签订契约 · 人格测试 | Persona 30th</title>
<link rel="icon" type="image/png" href="./images/favicon.png">
<link rel="apple-touch-icon" href="./images/favicon-180.png">
<meta name="description" content="24 道命运之问，找出与你灵魂共鸣的那一位 Persona 主角。">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --edge: max(0px, calc(50vw - 460px));
  --layer-h: 200vh;
  --base: min(
    clamp(72px, calc((50vw - 460px) * 0.48), 190px),
    calc(var(--layer-h) * 0.084)
  );
}

body {
  background: #f5f3f0;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(180,140,200,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(230,100,130,0.08) 0%, transparent 60%);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
  color: #1a1a1f;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ========== 顶部横幅 ========== */
.hero-banner {
  position: relative;
  width: 100%;
  background: #fff;
  border-bottom: 3px solid #e63946;
  z-index: 3;
  overflow: hidden;
}
.hero-banner img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 38vh;
  object-fit: cover;
}

/* ========== 背景装饰 ========== */
.bg-pattern {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(100,80,140,0.10) 1px, transparent 1.5px),
    repeating-linear-gradient(45deg, transparent 0, transparent 120px,
      rgba(140,100,200,0.035) 120px, rgba(140,100,200,0.035) 121px);
  background-size: 36px 36px, 100% 100%;
}
.bg-pattern::before {
  content: ''; position: absolute; top: 45%; right: 6%;
  width: 180px; height: 180px;
  border: 1px solid rgba(230,57,70,0.10); border-radius: 50%;
}
.bg-pattern::after {
  content: ''; position: absolute; bottom: 10%; left: 5%;
  width: 120px; height: 120px;
  border: 1px solid rgba(124,58,237,0.10); border-radius: 50%;
}
.bg-logo {
  position: fixed; bottom: -80px; left: -100px;
  width: 480px; height: 480px;
  background-image: url('./images/p30-logo.webp');
  background-size: contain; background-repeat: no-repeat; background-position: center;
  opacity: 0.04; z-index: 0; pointer-events: none;
  transform: rotate(-8deg);
}
.bg-hero {
  position: fixed; bottom: -100px; right: -120px;
  width: 620px; height: 620px;
  background-image: url('./images/persona-bg.webp');
  background-size: contain; background-repeat: no-repeat; background-position: center;
  opacity: 0.05; z-index: 0; pointer-events: none;
  transform: rotate(6deg);
}

/* ========== 塔罗牌层 ========== */
.tarot-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: var(--layer-h);
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
  contain: layout paint;
}

.tarot-wrap {
  --w: calc(var(--base) * var(--s, 1));
  --h: calc(var(--w) * 1.5);
  --lx: max(0px, calc(var(--edge) - var(--w) - var(--base) * 0.15 - var(--base) * var(--k, 0)));
  --rx: max(0px, calc(var(--edge) - var(--w) - var(--base) * 0.15 - var(--base) * var(--k, 0)));
  position: absolute;
  top: var(--t, auto);
  left: var(--l, auto);
  right: var(--r, auto);
  bottom: var(--b, auto);
  width: var(--w);
  height: var(--h);
  cursor: pointer;
  pointer-events: auto;
  z-index: 100;
  perspective: 1000px;
  transform-style: preserve-3d;
  transform: translate3d(0, 0, 0);
  transition:
    top 1.2s cubic-bezier(0.4, 0, 0.2, 1),
    left 1.2s cubic-bezier(0.4, 0, 0.2, 1),
    right 1.2s cubic-bezier(0.4, 0, 0.2, 1),
    bottom 1.2s cubic-bezier(0.4, 0, 0.2, 1),
    width 1.2s cubic-bezier(0.4, 0, 0.2, 1),
    height 1.2s cubic-bezier(0.4, 0, 0.2, 1),
    opacity 0.8s ease;
}

.tarot-card {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  border-radius: 6px;
  transform: rotate(var(--rot, 0deg)) rotateY(0deg);
  transition: transform 0.8s cubic-bezier(0.34, 1.18, 0.5, 1);
}

.tarot-wrap.flipped .tarot-card {
  transform: translate3d(0, -22px, 40px) rotate(var(--rot, 0deg)) rotateY(180deg);
}

.tarot-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 6px;
  overflow: hidden;
  background: #1a1a2e;
  box-shadow: 0 6px 18px rgba(40,30,80,0.25);
  transition: box-shadow 0.3s ease;
}

.tarot-wrap:hover .tarot-face {
  box-shadow:
    0 18px 36px -10px rgba(40,30,80,0.5),
    0 0 0 2px rgba(255,255,255,0.92);
}

.tarot-wrap.flipped .tarot-face {
  box-shadow:
    0 34px 62px -18px rgba(40,30,80,0.62),
    0 0 0 2px rgba(214,166,74,0.92),
    0 0 38px -6px rgba(214,166,74,0.5);
}

.tarot-back {
  background-image: url('./images/tarot-back.webp');
  background-size: cover;
  background-position: center;
}
.tarot-front {
  transform: rotateY(180deg);
  background-size: cover;
  background-position: center;
}

.tarot-wrap[data-layer="back"]  { opacity: 0.35; --s: 0.60; --k: 1.25; }
.tarot-wrap[data-layer="mid"]   { opacity: 0.66; --s: 0.78; --k: 0; }
.tarot-wrap[data-layer="front"] { opacity: 0.68; --s: 1;    --k: 0; }

.tarot-wrap[data-layer="back"] .tarot-face {
  box-shadow: 0 3px 8px -3px rgba(40,30,80,0.16);
}

.tarot-wrap:hover { opacity: 1 !important; z-index: 150; }
.tarot-wrap.flipped { opacity: 1 !important; z-index: 260; }

.tarot-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 6px;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(105deg,
    transparent 30%,
    rgba(255,255,255,0.62) 47%,
    rgba(255,255,255,0.18) 58%,
    transparent 72%);
  background-size: 260% 100%;
  background-position: 150% 0;
  transition:
    background-position 0.72s cubic-bezier(0.25, 0.6, 0.3, 1),
    opacity 0.3s ease;
}
.tarot-wrap:hover::after {
  opacity: 1;
  background-position: -70% 0;
}

/* ========== 内容区 ========== */
.content-wrap {
  position: relative;
  z-index: 2;
  min-height: calc(100vh - 38vh);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
  pointer-events: none;
}

.main-container {
  position: relative;
  z-index: 20;
  pointer-events: auto;
  max-width: 920px;
  width: 100%;
  background: #fff;
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 1.5rem;
  padding: 3rem 3rem 4rem;
  box-shadow: 0 30px 60px -30px rgba(40,20,60,0.15);
  contain: layout paint;
}

.header { text-align: center; margin-bottom: 3rem; }
.header-top {
  display: flex; align-items: center; justify-content: center;
  gap: 1.8rem; margin-bottom: 2.5rem; flex-wrap: wrap;
}
.header-logo {
  width: 120px; height: auto;
  transition: transform 0.42s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.header-logo:hover { transform: rotate(-5deg) scale(1.07); }
.header-text { text-align: left; }

.main-title {
  font-size: 3rem; font-weight: 900;
  letter-spacing: -0.03em; line-height: 1.1;
  color: #e63946; margin: 0 0 1rem;
  position: relative;
}
.main-title::after {
  content: ''; position: absolute;
  bottom: -0.5rem; left: 0;
  width: 80px; height: 4px;
  background: #e63946; border-radius: 2px;
  transform-origin: left center;
  transition: transform 0.46s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.main-title:hover::after { transform: scaleX(1.7); }
.subhead-main {
  font-size: 1.15rem; font-weight: 500;
  color: #1a1a1f; line-height: 1.6;
  margin: 0 0 0.5rem;
}
.subhead-sub {
  font-size: 0.9rem; font-weight: 400;
  color: #9b8fb0; line-height: 1.6; margin: 0;
}

/* hero 图：透明背景，用 filter: drop-shadow 让阴影贴合轮廓，不产生矩形白底 */
.hero-image {
  width: 100%; max-width: 720px; height: auto;
  display: block; margin: 0 auto 3rem;
  filter: drop-shadow(0 20px 40px rgba(60,40,90,0.18));
  transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.hero-image:hover { transform: translateY(-6px); }

/* 步骤卡片 */
.steps-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1.2rem; margin: 0 0 3.5rem;
}
.step-card {
  position: relative;
  overflow: hidden;
  background: #faf9fb;
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 1rem;
  padding: 2rem 1.6rem;
  contain: layout paint;
  transition:
    transform 0.36s cubic-bezier(0.2, 0.7, 0.3, 1),
    border-color 0.36s ease,
    background-color 0.36s ease,
    box-shadow 0.36s ease;
}
.step-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #e63946, #8b5cf6 55%, #d4a017);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.46s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.step-card:hover {
  transform: translateY(-6px);
  background: #fff;
  border-color: rgba(230,57,70,0.26);
  box-shadow: 0 20px 38px -20px rgba(60,30,90,0.3);
}
.step-card:hover::before { transform: scaleX(1); }

.step-number {
  font-size: 2rem; font-weight: 700; line-height: 1; margin-bottom: 1.2rem;
  transition: transform 0.36s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.step-card:nth-child(1) .step-number { color: #e63946; }
.step-card:nth-child(2) .step-number { color: #8b5cf6; }
.step-card:nth-child(3) .step-number { color: #d4a017; }
.step-card:hover .step-number { transform: translateY(-3px) scale(1.09); }
.step-card h3 {
  font-size: 1.15rem; font-weight: 600; margin-bottom: 0.6rem; color: #1a1a1f;
  transition: color 0.36s ease;
}
.step-card:hover h3 { color: #c62b3a; }
.step-card p { font-size: 0.9rem; color: #6b6578; line-height: 1.65; }

/* 关于区域 */
.about-section {
  background: #faf9fb;
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 1rem;
  padding: 3rem 2.5rem;
  text-align: center;
  contain: layout paint;
  content-visibility: auto;
  contain-intrinsic-size: 0 500px;
}
.about-section h2 {
  font-size: 1.5rem; font-weight: 600; color: #1a1a1f;
  margin-bottom: 2rem; position: relative; display: inline-block;
  padding-bottom: 1rem;
}
.about-section h2::after {
  content: ''; position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 40px; height: 2px; background: #e63946; border-radius: 2px;
  transition: transform 0.46s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.about-section h2:hover::after { transform: translateX(-50%) scaleX(1.9); }
.about-section p {
  font-size: 1rem; color: #6b6578;
  max-width: 580px; margin: 0 auto 1.5rem; line-height: 1.8;
}
.about-section p:last-child {
  margin-bottom: 0; color: #8a8496;
  font-style: italic; font-size: 0.95rem;
  border-top: 1px solid rgba(0,0,0,0.06);
  padding-top: 2rem; margin-top: 1rem;
}
.accent-crimson { color: #d62839; font-weight: 600; }
.accent-blue    { color: #3b7bbf; font-weight: 600; }
.accent-yellow  { color: #b8860b; font-weight: 600; }
.accent-purple  { color: #7c3aed; font-weight: 600; }
/* 新增：结城理专属蓝（用于“颜色”两个字） */
.accent-makoto  { color: #1b5a9c; font-weight: 600; }

.divider {
  width: 40px; height: 2px;
  background: rgba(230,57,70,0.6);
  margin: 2.5rem auto 0; border-radius: 2px;
  transition: transform 0.46s cubic-bezier(0.2, 0.7, 0.3, 1), background-color 0.36s ease;
}
.divider:hover { transform: scaleX(1.9); background: rgba(230,57,70,0.95); }
.quote-mark {
  font-size: 3rem; line-height: 1;
  color: rgba(230,57,70,0.2);
  font-family: Georgia, serif; user-select: none;
  margin-top: 1.5rem; display: inline-block; transform: scaleX(-1);
  transition: transform 0.46s cubic-bezier(0.2, 0.7, 0.3, 1), color 0.36s ease;
}
.quote-mark:hover {
  transform: scaleX(-1) translateY(-6px) rotate(-6deg);
  color: rgba(230,57,70,0.45);
}
.explore-badge {
  position: relative;
  overflow: hidden;
  display: inline-flex; align-items: center; gap: 0.6rem;
  background: transparent;
  border: 1px solid rgba(230,57,70,0.4);
  padding: 0.7rem 1.6rem; border-radius: 60px;
  font-size: 0.85rem; color: #b04a6a;
  letter-spacing: 0.5px; margin-top: 2rem;
  cursor: pointer;
  transition:
    color 0.36s ease,
    border-color 0.36s ease,
    box-shadow 0.36s ease,
    transform 0.36s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.explore-badge::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, #e63946, #b8324a);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.44s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.explore-badge > * { position: relative; z-index: 1; }
.explore-badge:hover {
  color: #fff;
  border-color: transparent;
  transform: translateY(-3px);
  box-shadow: 0 14px 26px -12px rgba(230,57,70,0.62);
}
.explore-badge:hover::before { transform: scaleX(1); }
.explore-badge svg {
  width: 16px; height: 16px; stroke: currentColor;
  transition: transform 0.36s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.explore-badge:hover svg { transform: translateX(4px); }


/* ========== 背景音乐播放器 ========== */

  --bgm-edge: rgba(214, 166, 74, 0.32);
  --bgm-edge-hi: rgba(214, 166, 74, 0.85);

  --bgm-ink-hi: #f6ebd2;
  --bgm-dim: rgba(240, 228, 202, 0.46);
  --bgm-rail: rgba(240, 228, 202, 0.16);
  --bgm-art-edge: rgba(214, 166, 74, 0.42);
  --bgm-accent: #c9a24a;
  --bgm-accent-hi: #dcb75f;
  --bgm-on-accent: #1a1822;
  --bgm-accent-glow: rgba(201, 162, 74, 0.5);
  --bgm-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.78);
  --bgm-shadow-hi: 0 24px 52px -22px rgba(0, 0, 0, 0.85);
  --bgm-knob: #1a1822;
  --bgm-disc-mid: #35323f;
  --bgm-disc-inner: #17151e;
  --bgm-disc-outer: #2c2935;
  --bgm-groove: rgba(255, 255, 255, 0.14);
}

.bgm-bar {
  position: fixed; right: 18px; bottom: 18px; z-index: 400;
  display: none;
  align-items: center;
  gap: 13px;
  width: 322px;
  padding: 12px;
  border: 1px solid var(--bgm-edge);
  border-radius: 18px;
  background: var(--bgm-surface);
  color: var(--bgm-ink);
  box-shadow: var(--bgm-shadow);
  transition:
    color 0.3s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease,
    transform 0.32s cubic-bezier(0.2, 0.7, 0.3, 1),
    opacity 0.26s ease,
    visibility 0s linear 0s;
}
.bgm-bar.is-ready { display: flex; }
.bgm-bar:hover {
  color: var(--bgm-ink-hi);
  transform: translateY(-2px);
  border-color: var(--bgm-edge-hi);
  box-shadow: var(--bgm-shadow-hi);
}
.bgm-bar:focus-within { color: var(--bgm-ink-hi); border-color: var(--bgm-edge-hi); }

.bgm-mini {
  position: fixed; right: 0; bottom: 18px; z-index: 401;
  display: none;
  width: 76px; height: 76px;
  padding: 0;
  border: 1px solid var(--bgm-edge);
  border-radius: 50%;
  background-image:
    repeating-radial-gradient(circle at 50% 50%,
      var(--bgm-groove) 0 1px, transparent 1px 3px),
    radial-gradient(circle at 50% 50%,
      var(--bgm-disc-mid) 0%, var(--bgm-disc-inner) 62%, var(--bgm-disc-outer) 100%);
  color: var(--bgm-ink);
  cursor: pointer;
  box-shadow: var(--bgm-shadow);
  transition:
    transform 0.28s cubic-bezier(0.2, 0.7, 0.3, 1),
    border-color 0.3s ease,
    box-shadow 0.3s ease;
}
.bgm-mini:hover {
  transform: translateX(-5px) scale(1.03);
  border-color: var(--bgm-edge-hi);
  box-shadow: var(--bgm-shadow-hi);
}
.bgm-mini:focus-visible { outline: 2px solid var(--bgm-edge-hi); outline-offset: 3px; }

body.bgm-collapsed .bgm-bar.is-ready {
  transform: translateX(calc(100% + 26px));
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    color 0.3s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease,
    transform 0.32s cubic-bezier(0.5, 0, 0.7, 0.5),
    opacity 0.26s ease,
    visibility 0s linear 0.32s;
}
body.bgm-collapsed .bgm-mini { display: block; animation: bgm-mini-in 0.3s ease; }

@keyframes bgm-mini-in { from { transform: translateX(40px); opacity: 0; } }

.bgm-mini-label {
  position: absolute; left: 50%; top: 50%;
  width: 40px; height: 40px;
  margin: -20px 0 0 -20px;
  border-radius: 50%;
  background-color: var(--bgm-surface);
  background-image: url(./images/tarot-back.webp);
  background-repeat: no-repeat;
  background-position: 50% 50%;
  background-size: 138% auto;
  animation: bgm-spin 7s linear infinite;
  animation-play-state: paused;
  pointer-events: none;
}
.bgm-mini-label.is-art { background-size: cover; }
.bgm-mini[data-playing="true"] .bgm-mini-label { animation-play-state: running; }

@keyframes bgm-spin { to { transform: rotate(360deg); } }

.bgm-mini-hole {
  position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--bgm-knob);
  box-shadow: inset 0 0 0 1px var(--bgm-edge);
  pointer-events: none;
}

.bgm-mini-badge {
  position: absolute; left: -3px; bottom: -3px;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--bgm-accent);
  color: var(--bgm-on-accent);
  box-shadow: 0 0 0 2px var(--bgm-surface), 0 3px 8px -3px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}
.bgm-mini-badge svg { width: 14px; height: 14px; display: block; }

.bgm-cover {
  flex: 0 0 auto;
  width: 104px; height: 104px;
  border-radius: 13px;
  background-image: url(./images/tarot-back.webp);
  background-repeat: no-repeat;
  background-size: 138% auto;
  background-position: 50% 50%;
  box-shadow: inset 0 0 0 1px var(--bgm-art-edge);
}
.bgm-cover.is-art {
  background-size: cover;
  background-position: 50% 50%;
}

.bgm-main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.bgm-head {
  display: flex; align-items: center; gap: 7px;
  min-width: 0;
}
.bgm-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13.5px;
  letter-spacing: 0.02em;
}
.bgm-count {
  flex: 0 0 auto;
  font-size: 10.5px;
  letter-spacing: 0.1em;
  font-variant-numeric: tabular-nums;
  color: var(--bgm-dim);
}

.bgm-track {
  position: relative;
  display: flex; align-items: center;
  height: 16px;
  cursor: pointer;
  touch-action: none;
}
.bgm-track:focus-visible {
  outline: 2px solid var(--bgm-edge-hi);
  outline-offset: 2px;
  border-radius: 4px;
}
.bgm-rail {
  position: relative;
  display: block;
  width: 100%; height: 4px;
  border-radius: 2px;
  background: var(--bgm-rail);
}
.bgm-rail > i {
  display: block; width: 100%; height: 100%;
  border-radius: 2px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: 0 50%;
}
.bgm-knob {
  position: absolute; top: 50%; left: 0;
  width: 10px; height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: var(--bgm-knob);
  box-shadow: 0 0 0 2px currentColor;
  transform: translateX(0);
  pointer-events: none;
}
.bgm-knob-sm { width: 8px; height: 8px; margin: -4px 0 0 -4px; }

.bgm-foot { display: flex; align-items: center; gap: 8px; }
.bgm-time {
  flex: 1 1 auto; min-width: 0;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.bgm-btns { display: flex; align-items: center; gap: 2px; }

.bgm-btn {
  flex: 0 0 auto;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
}
.bgm-btn:hover { background: var(--bgm-rail); }
.bgm-btn:active { transform: scale(0.9); }
.bgm-btn:focus-visible { outline: 2px solid var(--bgm-edge-hi); outline-offset: 1px; }
.bgm-btn svg { width: 17px; height: 17px; display: block; }

.bgm-btn-main {
  width: 34px; height: 34px;
  margin: 0 3px;
  background: var(--bgm-accent);
  color: var(--bgm-on-accent);
  box-shadow: 0 6px 14px -7px var(--bgm-accent-glow);
}
.bgm-btn-main:hover { background: var(--bgm-accent-hi); }
.bgm-btn-main svg { width: 19px; height: 19px; }
.bgm-btn .ico-pause { display: none; }
.bgm-btn[data-playing="true"] .ico-play  { display: none; }
.bgm-btn[data-playing="true"] .ico-pause { display: block; }

.bgm-btn.bgm-min { width: 22px; height: 22px; }
.bgm-btn.bgm-min svg { width: 14px; height: 14px; }

.bgm-volrow { display: flex; align-items: center; gap: 6px; }
.bgm-btn-vol { width: 22px; height: 22px; }
.bgm-btn-vol svg { width: 15px; height: 15px; }
.bgm-track-vol { flex: 1 1 auto; min-width: 0; }
.bgm-rail-vol { height: 3px; }
.bgm-btn .ico-mute { display: none; }

@media (max-width: 620px) {

@media (prefers-reduced-motion: reduce) {

  var currentIndex = 0;

  var overlay = document.getElementById('quizOverlay');
  var btn = document.getElementById('startQuizBtn');
  var indexEl = document.getElementById('quizIndex');
  var qTextEl = document.getElementById('quizQuestionText');
  var optsEl = document.getElementById('quizOptions');
  var progressBar = document.getElementById('quizProgressBar');
  var questionArea = document.getElementById('quizQuestionArea');
  var resultArea = document.getElementById('quizResultArea');
  var resultName = document.getElementById('quizResultName');
  var resultDesc = document.getElementById('quizResultDesc');
  var restartBtn = document.getElementById('quizRestartBtn');

  // 独立答题页：进来就是答题，不需要先在首页点那个按钮。
  // overlay.classList.add 保留着 —— 万一以后又把它嵌回首页当浮层，这段还能直接用。
  overlay.classList.add("active");
  resetQuiz();

  // 重置并开始答题
  function resetQuiz() {
    currentIndex = 0;
    scores = {};
    characters.forEach(function (c) { scores[c.name] = 0; });
    resultArea.style.display = 'none';
    questionArea.style.display = 'block';
    showQuestion();
  }

  // 显示当前题目
  function showQuestion() {
    var q = questions[currentIndex];
    indexEl.textContent = 'Q' + (currentIndex + 1) + ' / ' + questions.length;
    qTextEl.textContent = q.q;
    progressBar.style.width = ((currentIndex) / questions.length * 100) + '%';
    optsEl.innerHTML = '';

    q.options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = opt.text;
      btn.addEventListener('click', function () {
        // 加分
        for (var key in opt.scores) {
          if (scores[key] !== undefined) scores[key] += opt.scores[key];
        }
        currentIndex++;
        if (currentIndex < questions.length) {
          showQuestion();
        } else {
          showResult();
        }
      });
      optsEl.appendChild(btn);
    });
  }

  // 显示结果
  function showResult() {
    progressBar.style.width = '100%';
    questionArea.style.display = 'none';
    resultArea.style.display = 'block';

    // 找出最高分（如果平局，随机选择一个）
    var maxScore = -1;
    var topChars = [];
    characters.forEach(function (c) {
      if (scores[c.name] > maxScore) {
        maxScore = scores[c.name];
        topChars = [c];
      } else if (scores[c.name] === maxScore) {
        topChars.push(c);
      }
    });
    var topChar = topChars[Math.floor(Math.random() * topChars.length)];

    resultName.textContent = topChar.name + ' / ' + topChar.en;
    resultDesc.textContent = topChar.desc;
  }

  // 重新开始
  restartBtn.addEventListener('click', function () {
    resetQuiz();
  });

  // 点击遮罩关闭（可选）
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) {
      overlay.classList.remove('active');
    }
  });
})();


// ==================== 背景音乐 ====================
(function () {
  'use strict';

  var bar = document.getElementById('bgmBar');
  if (!bar) return;

  var coverEl   = document.getElementById('bgmCover');

  var btnMini   = document.getElementById('bgmMini');
  var miniLabel = document.getElementById('bgmMiniLabel');
  var countEl   = document.getElementById('bgmCount');
  var timeEl    = document.getElementById('bgmTime');
  var fillEl    = document.getElementById('bgmFill');
  var knobEl    = document.getElementById('bgmKnob');
  var seekEl    = document.getElementById('bgmSeek');
  var btnPrev   = document.getElementById('bgmPrev');
  var btnPlay   = document.getElementById('bgmPlay');
  var btnNext   = document.getElementById('bgmNext');
  var btnMute   = document.getElementById('bgmMute');
  var volEl     = document.getElementById('bgmVol');
  var volFillEl = document.getElementById('bgmVolFill');
  var volKnobEl = document.getElementById('bgmVolKnob');

  var VOL_DEFAULT = 0.4;
  var FADE_IN  = 1400;
  var FADE_OUT = 320;

  var tracks = (window.YYS_TRACKS || []).filter(function (t) {
    return t && typeof t.file === 'string' && t.file;
  });
  if (!tracks.length) return;

  var el = null;
  var idx = 0;
  var fadeTimer = 0;
  var armed = false;
  var resumeAfterHidden = false;
  var failStreak = 0;
  var vol = VOL_DEFAULT;
  var muted = false;

  function targetVol() { return muted ? 0 : vol; }

  var GESTURES = ['pointerdown', 'pointerup', 'click', 'keydown', 'touchend'];

  function fadeTo(to, ms, done) {
    clearInterval(fadeTimer);
    if (!el) { if (done) done(); return; }
    var from = el.volume;
    var steps = Math.max(1, Math.round(ms / 40));
    var i = 0;
    fadeTimer = setInterval(function () {
      i++;
      el.volume = Math.max(0, Math.min(1, from + (to - from) * (i / steps)));
      if (i >= steps) {
        clearInterval(fadeTimer);
        el.volume = to;
        if (done) done();
      }
    }, 40);
  }

  function paintArt(el, url) {
    if (!el) return;
    if (url) {
      el.style.backgroundImage = 'url("' + encodeURI(url) + '")';
      el.classList.add('is-art');
    } else {
      el.style.backgroundImage = '';
      el.classList.remove('is-art');
    }
  }
  function setCover(url) {
    paintArt(coverEl, url);
    paintArt(miniLabel, url);
  }

  function paint() {
    var t = tracks[idx];
    if (titleEl) titleEl.textContent = t.title || t.file;
    if (countEl) countEl.textContent = pad2(idx + 1) + ' / ' + pad2(tracks.length);
    setCover(t.cover);
    if (btnMini) {
      var mn = '展开播放器：' + (t.title || t.file);
      btnMini.setAttribute('aria-label', mn);
      btnMini.setAttribute('title', mn);
    }
    var playing = !!el && !el.paused;
    btnPlay.setAttribute('data-playing', playing ? 'true' : 'false');
    bar.setAttribute('data-playing', playing ? 'true' : 'false');
    if (btnMini) btnMini.setAttribute('data-playing', playing ? 'true' : 'false');
    var label = playing ? '暂停' : '播放';
    btnPlay.setAttribute('aria-label', label);
    btnPlay.setAttribute('title', label);
    paintVol();
    tickTime();
  }

  // 合并存储：一次 setItem 替代原来四次
  function remember() {
    try {
      localStorage.setItem('yys-bgm', JSON.stringify({
        idx: idx,
        off: (el && el.paused) ? 1 : 0,
        vol: vol.toFixed(2),
        mute: muted ? 1 : 0,
      }));
    } catch (err) {}
  }

  function tickProgress() {
    if (!el) return;
    var d = el.duration;
    var r = (d && isFinite(d) && d > 0) ? (el.currentTime / d) : 0;
    paintTrack(fillEl && fillEl.parentNode, fillEl, knobEl, r);
    if (seekEl) seekEl.setAttribute('aria-valuenow', Math.round(clamp01(r) * 100));
    tickTime();
  }

  function clamp01(v) { return v > 1 ? 1 : v < 0 ? 0 : (isFinite(v) ? v : 0); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + pad2(s % 60);
  }

  function paintTrack(rail, fill, knob, r) {
    r = clamp01(r);
    if (fill) fill.style.transform = 'scaleX(' + r.toFixed(4) + ')';
    if (knob && rail) knob.style.transform = 'translateX(' + (r * rail.clientWidth).toFixed(1) + 'px)';
    return r;
  }

  function paintVol() {
    var rail = volFillEl && volFillEl.parentNode;
    var r = paintTrack(rail, volFillEl, volKnobEl, muted ? 0 : vol);
    if (btnMute) {
      btnMute.setAttribute('data-muted', muted ? 'true' : 'false');
      var l = muted ? '取消静音' : '静音';
      btnMute.setAttribute('aria-label', l);
      btnMute.setAttribute('title', l);
    }
    if (volEl) volEl.setAttribute('aria-valuenow', Math.round(r * 100));
  }

  function tickTime() {
    if (!timeEl || !el) return;
    timeEl.textContent = fmt(el.currentTime) + ' / ' + fmt(el.duration);
  }

  function bindDrag(trackEl, opts) {
    if (!trackEl) return;
    var dragging = false;
    function ratioOf(ev) {
      var r = trackEl.getBoundingClientRect();
      if (!r.width) return 0;
      return clamp01((ev.clientX - r.left) / r.width);
    }
    trackEl.addEventListener('pointerdown', function (ev) {
      dragging = true;
      try { trackEl.setPointerCapture(ev.pointerId); } catch (e) {}
      opts.set(ratioOf(ev));
      ev.preventDefault();
    });
    trackEl.addEventListener('pointermove', function (ev) {
      if (dragging) opts.set(ratioOf(ev));
    });
    function end(ev) {
      if (!dragging) return;
      dragging = false;
      try { trackEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      if (opts.done) opts.done();
    }
    trackEl.addEventListener('pointerup', end);
    trackEl.addEventListener('pointercancel', end);
    trackEl.addEventListener('keydown', function (ev) {
      var step = ev.shiftKey ? 0.1 : 0.02;
      var now = opts.get ? opts.get() : 0;
      var next;
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') next = now + step;
      else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') next = now - step;
      else if (ev.key === 'Home') next = 0;
      else if (ev.key === 'End') next = 1;
      else return;
      ev.preventDefault();
      opts.set(clamp01(next));
      if (opts.done) opts.done();
    });
  }

  function start() {
    if (!el || !el.paused) return;
    el.volume = 0;
    var p = el.play();
    if (!p || !p.then) { fadeTo(targetVol(), FADE_IN); paint(); return; }
    p.then(function () {
      failStreak = 0;
      fadeTo(targetVol(), FADE_IN);
      paint();
    }).catch(function () {
      arm();
    });
  }

  function arm() {
    if (armed) return;
    armed = true;
    for (var i = 0; i < GESTURES.length; i++) {
      window.addEventListener(GESTURES[i], kick, true);
    }
  }

  function kick(e) {
    for (var i = 0; i < GESTURES.length; i++) {
      window.removeEventListener(GESTURES[i], kick, true);
    }
    armed = false;
    if (e && e.target && bar.contains(e.target)) return;
    start();
  }

  function switchTo(i) {
    var n = tracks.length;
    idx = ((i % n) + n) % n;
    var t = tracks[idx];

    fadeTo(0, FADE_OUT, function () {
      el.src = encodeURI('./music/' + t.file);
      el.load();
      el.volume = 0;
      tickProgress();
      paint();
      remember();
      var p = el.play();
      if (!p || !p.then) { fadeTo(targetVol(), 700); paint(); return; }
      p.then(function () { failStreak = 0; fadeTo(targetVol(), 700); paint(); })
       .catch(function () { arm(); });
    });
  }

  // 兼容读取：新格式 JSON，旧格式分键
  var savedIdx = 0, wantOff = false;
  try {
    var raw = localStorage.getItem('yys-bgm');
    if (raw && raw.charAt(0) === '{') {
      var saved = JSON.parse(raw);
      savedIdx = parseInt(saved.idx, 10) || 0;
      wantOff = saved.off === 1 || saved.off === '1';
      var sv = parseFloat(saved.vol);
      if (isFinite(sv) && sv >= 0 && sv <= 1) vol = sv;
      muted = saved.mute === 1 || saved.mute === '1';
    } else {
      savedIdx = parseInt(raw, 10) || 0;
      wantOff = localStorage.getItem('yys-bgm-off') === '1';
      var sv2 = parseFloat(localStorage.getItem('yys-bgm-vol'));
      if (isFinite(sv2) && sv2 >= 0 && sv2 <= 1) vol = sv2;
      muted = localStorage.getItem('yys-bgm-mute') === '1';
    }
  } catch (err) {}
  idx = (savedIdx >= 0 && savedIdx < tracks.length) ? savedIdx : 0;

  el = new Audio();
  el.preload = 'auto';
  el.volume = 0;
  el.src = encodeURI('./music/' + tracks[idx].file);

  el.addEventListener('timeupdate', tickProgress);
  el.addEventListener('loadstart', tickProgress);
  el.addEventListener('ended', function () { switchTo(idx + 1); });
  el.addEventListener('play', paint);
  el.addEventListener('pause', paint);
  el.addEventListener('error', function () {
    failStreak++;
    if (failStreak >= tracks.length) {
      bar.classList.remove('is-ready');
      return;
    }
    switchTo(idx + 1);
  });

  btnPlay.addEventListener('click', function () {
    if (el.paused) {
      start();
    } else {
      fadeTo(0, 400, function () { el.pause(); paint(); remember(); });
    }
  });
  btnPrev.addEventListener('click', function () { switchTo(idx - 1); });
  btnNext.addEventListener('click', function () { switchTo(idx + 1); });
  btnMute.addEventListener('click', function () {
    muted = !muted;
    fadeTo(targetVol(), 220);
    paintVol();
    remember();
  });

  function setCollapsed(on) {
    document.body.classList.toggle('bgm-collapsed', !!on);
    var target = on ? btnMini : btnMin;
    if (target && target.focus) {
      try { target.focus({ preventScroll: true }); } catch (err) { target.focus(); }
    }
  }
  btnMin.addEventListener('click', function () { setCollapsed(true); });
  btnMini.addEventListener('click', function () { setCollapsed(false); });

  bindDrag(seekEl, {
    set: function (r) {
      var d = el && el.duration;
      if (!d || !isFinite(d) || d <= 0) return;
      el.currentTime = r * d;
      tickProgress();
    },
    get: function () {
      var d = el && el.duration;
      return (d && isFinite(d) && d > 0) ? el.currentTime / d : 0;
    },
  });

  bindDrag(volEl, {
    set: function (r) {
      clearInterval(fadeTimer);
      vol = r;
      if (r > 0) muted = false;
      if (el) el.volume = targetVol();
      paintVol();
    },
    get: function () { return muted ? 0 : vol; },
    done: remember,
  });

  window.addEventListener('resize', function () { tickProgress(); paintVol(); }, { passive: true });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (!el.paused) {
        resumeAfterHidden = true;
        el.pause();
        paint();
      }
    } else if (resumeAfterHidden) {
      resumeAfterHidden = false;
      start();
    }
  }, { passive: true });

  bar.classList.add('is-ready');
  paint();
  tickProgress();

  if (!wantOff) start();
})();
</script>
</body>
</html>
