* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f3f0; font-family: system-ui, sans-serif; color: #1a1a1f; min-height: 100vh; }
.hero-banner { width: 100%; background: #fff; border-bottom: 3px solid #e63946; }
.hero-banner img { display: block; width: 100%; height: auto; max-height: 38vh; object-fit: cover; }

.tarot-layer { position: absolute; top: 0; left: 0; width: 100%; height: 200vh; z-index: 1; pointer-events: none; overflow: hidden; }
.tarot-wrap { position: absolute; top: var(--t, auto); left: var(--l, auto); right: var(--r, auto); bottom: var(--b, auto); width: var(--w, 90px); height: var(--h, 136px); cursor: pointer; pointer-events: auto; z-index: 100; transition: top 1.2s cubic-bezier(0.4,0,0.2,1), left 1.2s cubic-bezier(0.4,0,0.2,1), right 1.2s cubic-bezier(0.4,0,0.2,1), bottom 1.2s cubic-bezier(0.4,0,0.2,1), width 1.2s, height 1.2s, opacity 0.8s; }

.tarot-card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.75s cubic-bezier(0.4,0,0.2,1); }
.tarot-wrap.flipped .tarot-card { transform: rotateY(180deg) !important; }
.tarot-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px; overflow: hidden; background: #1a1a2e; box-shadow: 0 8px 24px rgba(40,30,80,0.25); }
.tarot-back { background-image: url('images/tarot-back.png'); background-size: cover; background-position: center; }
.tarot-front { transform: rotateY(180deg); background-size: cover; background-position: center; }
.tarot-wrap:hover .tarot-face { box-shadow: 0 18px 42px rgba(40,30,80,0.42); }
.tarot-wrap[data-layer="back"] { opacity: 0.35; }
.tarot-wrap[data-layer="mid"] { opacity: 0.6; }
.tarot-wrap[data-layer="front"] { opacity: 0.85; }
.tarot-wrap:hover { opacity: 1 !important; }
.tarot-wrap.flipped { opacity: 1 !important; z-index: 200; }

.content-wrap { position: relative; z-index: 2; min-height: calc(100vh - 38vh); display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
.main-container { max-width: 920px; width: 100%; background: #fff; border: 1px solid rgba(0,0,0,0.06); border-radius: 1.5rem; padding: 3rem 3rem 4rem; box-shadow: 0 30px 60px -30px rgba(40,20,60,0.15); }
.header { text-align: center; margin-bottom: 3rem; }

.hero-image { width: 100%; max-width: 720px; height: auto; display: block; margin: 2rem auto 3rem; }
.steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-bottom: 3.5rem; }
.step-card { background: #faf9fb; border: 1px solid rgba(0,0,0,0.06); border-radius: 1rem; padding: 2rem 1.6rem; }
.step-number { font-size: 2rem; font-weight: 700; margin-bottom: 1.2rem; }

.step-card p { font-size: 0.9rem; color: #6b6578; }
.about-section { background: #faf9fb; border: 1px solid rgba(0,0,0,0.06); border-radius: 1rem; padding: 3rem 2.5rem; text-align: center; }
.about-section h2 { font-size: 1.5rem; margin-bottom: 2rem; }

@media (max-width: 700px) {

  .header-text { text-align: center; }
  .main-title { font-size: 2.2rem; }
  .steps-grid { grid-template-columns: 1fr; }
  .tw-10,.tw-11,.tw-12,.tw-13,.tw-14,.tw-15,.tw-16,.tw-17,.tw-18,.tw-19,.tw-20,.tw-21 { display: none; }
}

<script>
document.querySelectorAll('.tarot-wrap').forEach(function (wrap) {
  wrap.addEventListener('click', function () {
    wrap.classList.toggle('flipped');
  });
});
var banner = document.querySelector('.hero-banner');
function updateLayout() {
  var y = window.scrollY || window.pageYOffset;
  var shouldScroll = y > banner.offsetHeight * 0.7;
  document.body.classList.toggle('layout-top', !shouldScroll);
  document.body.classList.toggle('layout-scrolled', shouldScroll);
}
window.addEventListener('scroll', updateLayout, { passive: true });
updateLayout();
</script>
